<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Dragan Spiridonov — Quality engineering, grounded in practice.</title><desc id="desc">Original Agentic QE visual in dark teal and cyan. Dragan Spiridonov — Quality engineering, grounded in practice.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071a20"/><stop offset="1" stop-color="#10343b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#61cbc9" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="380" rx="22" fill="url(#bg)"/><rect width="1200" height="380" rx="22" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif" fill="#e6f4f4"><text x="50" y="52" font-size="18" fill="#78ddd3" letter-spacing="3">DRAGAN SPIRIDONOV / QUALITY FORGE</text><text x="50" y="126" font-size="56" fill="#e6f4f4" font-weight="700">Quality engineering,</text><text x="50" y="191" font-size="56" fill="#e6f4f4" font-weight="700">grounded in practice.</text><text x="50" y="253" font-size="23" fill="#bed8dc" >Classical testing judgment. Agentic tools. Evidence to inspect.</text><text x="50" y="332" font-size="16" fill="#78ddd3" letter-spacing="3">LEARN  /  BUILD  /  VERIFY  /  SHARE</text><g transform="translate(920,132) scale(1)"><path d="M0 0 65 -37 130 0V100L65 138 0 100Z" fill="#0d343b" stroke="#55dfcf" stroke-width="3"/><path d="M33 48 57 72 101 22" fill="none" stroke="#6ee7d5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M-68 25H-18M-52 58H-18M-38 91H-18M150 58H218" stroke="#73d6e8" stroke-width="3"/><circle cx="224" cy="58" r="7" fill="#73d6e8"/></g></g></svg>